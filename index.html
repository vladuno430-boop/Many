<style>
  :root{
    --bg:#09090B; --panel:#111114; --panel-2:#17171C; --raise:#1E1E24;
    --tx:#F2F0EE; --dim:#A2A0A8; --line:rgba(255,255,255,.09);
    --accent:#D8402F; --kin:#D2A63C;
    --side:248px; --player-h:92px; --top-h:64px;
  }
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--tx);overflow:hidden}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border:3px solid transparent;background-clip:content-box;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---- app shell: sidebar + scrolling main + fixed player ---- */
  #shell{display:grid;grid-template-columns:var(--side) 1fr;gap:8px;
    height:100svh;padding:8px 8px calc(var(--player-h) + 8px);}
  #side{background:var(--panel);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  #main{background:linear-gradient(180deg,var(--panel-2),var(--panel) 260px);
    border-radius:12px;position:relative;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
  #topbar{position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;gap:12px;
    padding:0 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    background:linear-gradient(180deg,rgba(9,9,11,.82),rgba(9,9,11,.4));border-radius:12px 12px 0 0}
  @media (max-width:900px){
    :root{--player-h:150px}
    #shell{grid-template-columns:1fr;padding:8px 8px calc(var(--player-h) + 8px)}
    #side{position:fixed;inset:8px auto 8px 8px;width:min(84vw,300px);z-index:70;
      transform:translateX(calc(-100% - 12px));transition:transform .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 24px 70px rgba(0,0,0,.7)}
    #side.open{transform:none}
  }

  .navi{display:flex;align-items:center;gap:14px;padding:9px 14px;border-radius:8px;
    color:var(--dim);font-weight:600;font-size:14px;transition:color .18s,background .18s;width:100%;text-align:left}
  .navi:hover{color:var(--tx)}
  .navi[aria-current="page"]{color:var(--tx);background:rgba(255,255,255,.08)}
  .navi svg{width:20px;height:20px;flex:none}

  .plitem{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:7px;width:100%;text-align:left;transition:background .18s}
  .plitem:hover{background:rgba(255,255,255,.07)}
  .plitem[aria-current="page"]{background:rgba(255,255,255,.1)}

  /* ---- track rows ---- */
  .trow{display:grid;grid-template-columns:28px 4fr 3fr 92px;gap:14px;align-items:center;
    padding:7px 14px;border-radius:6px;transition:background .16s}
  .trow:hover{background:rgba(255,255,255,.08)}
  .trow .idx .n{display:block}.trow .idx .p{display:none}
  .trow:hover .idx .n{display:none}.trow:hover .idx .p{display:block}
  .trow.current .t-name{color:var(--accent)}
  .trow .heart{opacity:0;transition:opacity .16s}
  .trow:hover .heart,.trow .heart.on{opacity:1}
  @media (max-width:820px){
    .trow{grid-template-columns:28px 1fr 60px}
    .trow .album{display:none}
  }

  .card{background:var(--raise);border-radius:8px;padding:14px;transition:background .2s;position:relative}
  .card:hover{background:#2A2A33}
  .card .go{position:absolute;right:18px;bottom:74px;width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;background:var(--accent);color:#fff;opacity:0;transform:translateY(8px);
    box-shadow:0 8px 22px rgba(0,0,0,.5);transition:opacity .22s,transform .22s}
  .card:hover .go{opacity:1;transform:none}

  .eq{display:flex;align-items:flex-end;gap:2px;height:13px}
  .eq i{width:3px;background:currentColor;border-radius:2px;animation:bar .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.14s}.eq i:nth-child(3){animation-delay:.28s}.eq i:nth-child(4){animation-delay:.42s}
  @keyframes bar{0%,100%{height:20%}50%{height:100%}}

  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s}
  input[type=range]:hover::-webkit-slider-thumb{opacity:1}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
  .bar{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
  .bar>i{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:2px}
  .barwrap:hover .bar>i{background:var(--accent)}

  :where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--tx);outline-offset:2px;border-radius:4px}

  #player{position:fixed;inset:auto 0 0 0;height:var(--player-h);z-index:60;
    display:grid;grid-template-columns:1fr minmax(0,42%) 1fr;align-items:center;gap:16px;
    padding:0 16px;background:var(--bg);border-top:1px solid var(--line)}
  @media (max-width:900px){
    #player{grid-template-columns:1fr;gap:6px;padding:10px 12px;align-content:center}
    #p-right{justify-content:center}
  }

  #queue{position:fixed;top:8px;bottom:calc(var(--player-h) + 8px);right:8px;width:min(94vw,340px);z-index:65;
    background:var(--panel);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;
    transform:translateX(calc(100% + 16px));transition:transform .34s cubic-bezier(.2,.9,.25,1)}
  #queue.open{transform:none;box-shadow:0 24px 70px rgba(0,0,0,.7)}

  #scrim{position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
  #scrim.on{opacity:1;visibility:visible}

  .sheet{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
  .sheet[hidden]{display:none}

  .chip{border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;
    background:rgba(255,255,255,.08);color:var(--dim);transition:background .18s,color .18s}
  .chip:hover{background:rgba(255,255,255,.16);color:var(--tx)}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff}

  .fade{animation:fade .34s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}}
  .hero-grad{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 46%,#111114),var(--panel-2) 78%)}

  #saver{position:fixed;inset:0;z-index:110;background:#050406;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
  #saver.on{opacity:1;visibility:visible}
  #saver canvas{position:absolute;inset:0;width:100%;height:100%}
  .saver-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 42%,rgba(0,0,0,.72))}
  #slash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0}
  #slash .blade{position:absolute;top:50%;left:-60%;width:220%;height:2px;
    background:linear-gradient(90deg,transparent,#fff 30%,#E8CE84 50%,#fff 70%,transparent);
    box-shadow:0 0 18px 4px rgba(232,206,132,.85);transform:rotate(-14deg) translateX(-100%)}
  #slash.go{opacity:1}
  #slash.go .blade{animation:slash .62s cubic-bezier(.5,0,.2,1) forwards}
  @keyframes slash{from{transform:rotate(-14deg) translateX(-100%)}to{transform:rotate(-14deg) translateX(100%)}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
    #main{scroll-behavior:auto}
  }
</style>

    return {id:'au-'+t.id,src:'audius',title:t.title,artist:(t.user&&t.user.name)||'Unknown',
      album:t.genre||'',genre:t.genre||'',art:a['1000x1000']||a['480x480']||a['150x150']||'',
      duration:t.duration||0,plays:t.play_count||0,
      stream:`https://api.audius.co/v1/tracks/${t.id}/stream?app_name=${APP}`,
      link:t.permalink?('https://audius.co'+t.permalink):'https://audius.co',full:true};
  }
  async function audius(path,params){
    const qs=new URLSearchParams(Object.assign({app_name:APP},params)).toString();
    const r=await fetch(`https://api.audius.co/v1${path}?${qs}`);
    if(!r.ok)throw new Error('audius '+r.status);
    const j=await r.json();
    return (j.data||[]).filter(t=>t&&!t.is_delete&&t.id).map(mapAudius);
  }
  const loadTrends=()=>audius('/tracks/trending',{limit:30});
  const searchMusic=q=>audius('/tracks/search',{query:q,limit:30});

  let TRENDS=[],SEARCH=[],searchQ='';

  const ACCENTS=['#D8402F','#14857A','#3D8BC4','#C4487E','#D2A63C','#6B3FA0'];
  const TASTE=['Electronic','House','Techno','Lo-Fi','Hip-Hop/Rap','Ambient','Drum & Bass','Jazz','Rock','Pop'];
  const initials=n=>(n||'G').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'G';

  function avatarHTML(){
    return prof.photo

      : `<span>${esc(initials(prof.name))}</span>`;

  function applyProfile(){
    document.documentElement.style.setProperty('--accent',prof.accent);
    ['#avatar-mini','#avatar-big'].forEach(sel=>{
      const el=$(sel);if(!el)return;
      el.innerHTML=avatarHTML();

    $('#prof-stats').textContent=`${liked.size} liked · ${lists.length} playlist${lists.length===1?'':'s'}`;

  const fillForm=()=>{$('#prof-name').value=prof.name;$('#prof-handle').value=prof.handle;$('#prof-bio').value=prof.bio};

  // ============================================================ audio
  const aC=$('#a-cors');
  let ctx=null,master=null,analyser=null,srcNode=null;
  function actx(){
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;
      ctx=new AC();master=ctx.createGain();analyser=ctx.createAnalyser();
      analyser.fftSize=128;analyser.smoothingTimeConstant=.8;
      master.connect(analyser);analyser.connect(ctx.destination)}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function wire(){if(srcNode)return;try{const c=actx();srcNode=c.createMediaElementSource(aC);srcNode.connect(master)}catch(e){}}

  const P={queue:[],index:-1,cur:null,el:null,playing:false,
    vol:LS.get('vol',.8),shuffle:LS.get('shuffle',false),repeat:LS.get('repeat','off')};
  const ui={title:$('#p-title'),artist:$('#p-artist'),art:$('#p-art'),cur:$('#p-cur'),dur:$('#p-dur'),
    seek:$('#p-seek'),fill:$('#p-fill'),play:$('#p-play'),icP:$('#ic-play'),icPa:$('#ic-pause'),icL:$('#ic-load'),fav:$('#p-fav')};
  const heart=on=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" style="${on?'color:var(--accent)':''}"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;
  const setLoading=on=>{ui.icL.classList.toggle('hidden',!on);if(on){ui.icP.classList.add('hidden');ui.icPa.classList.add('hidden')}};

  function paint(){
    const on=P.playing;
    ui.icP.classList.toggle('hidden',on);ui.icPa.classList.toggle('hidden',!on);ui.icL.classList.add('hidden');
    ui.play.setAttribute('aria-label',on?'Pause':'Play');
    ui.fav.innerHTML=heart(!!(P.cur&&liked.has(P.cur.id)));
    $$('[data-track]').forEach(n=>{
      const mine=!!(P.cur&&n.dataset.track===P.cur.id);
      n.classList.toggle('current',mine);
      const eq=n.querySelector('.eq-badge');if(eq)eq.classList.toggle('hidden',!(mine&&on));
      const ic=n.querySelector('.row-ic');
      if(ic)ic.innerHTML=mine&&on
        ? '<svg viewBox="0 0 24 24" fill="currentColor" class="h-3.5 w-3.5"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor" class="h-3.5 w-3.5"><path d="M8 5v14l11-7z"/></svg>';
    });
    $$('[data-heart]').forEach(b=>{b.innerHTML=heart(liked.has(b.dataset.heart));b.classList.toggle('on',liked.has(b.dataset.heart))});
    paintModes();
  }
  function paintModes(){
    const sh=$('#p-shuffle'),rp=$('#p-repeat');
    sh.setAttribute('aria-pressed',String(P.shuffle));sh.style.color=P.shuffle?'var(--accent)':'var(--dim)';

    $('#rep-one').classList.toggle('hidden',P.repeat!=='one');

  }
  function syncPlaying(){
    const v=!aC.paused&&!aC.ended&&aC.readyState>2;
    if(v!==P.playing){P.playing=v;paint()}
  }

  function play(track,queue){
    if(queue&&queue.length)P.queue=queue.slice();
    if(!P.queue.length)P.queue=[track];
    const i=P.queue.findIndex(t=>t.id===track.id);
    P.index=i>=0?i:0;
    P.cur=track;P.el=aC;
    wire();
    try{aC.pause()}catch(e){}
    aC.src=track.stream;aC.volume=P.vol;
    setLoading(true);
    aC.play().then(syncPlaying).catch(()=>{P.playing=false;paint();toast('Could not play that track')});
    ui.title.textContent=track.title;ui.artist.textContent=track.artist;
    const cover=track.art?`<img src="${esc(track.art)}" alt="" class="h-full w-full object-cover" />`:'';
    ui.art.innerHTML=cover;
    ui.dur.textContent=track.duration?clock(track.duration):'0:00';
    recent=[track,...recent.filter(t=>t.id!==track.id)].slice(0,12);LS.set('recent',recent);
    paint();drawQueue();
    if(view==='home')renderHome();
  }
  function toggle(){
    if(!P.cur){const l=viewTracks();if(l.length)play(l[0],l);return}
    if(P.playing)aC.pause();else aC.play().catch(()=>{});
    syncPlaying();
  }
  function step(d,auto){
    if(!P.queue.length)return;
    let i;
    if(P.shuffle&&d>0&&P.queue.length>1){do{i=Math.floor(Math.random()*P.queue.length)}while(i===P.index)}
    else{i=P.index+d;
      if(i>=P.queue.length){if(auto&&P.repeat!=='all'){P.playing=false;paint();return}i=0}
      if(i<0)i=P.queue.length-1}
    P.index=i;play(P.queue[i],P.queue);
  }
  function advance(){
    if(P.repeat==='one'&&P.cur){aC.currentTime=0;aC.play().catch(()=>{});return}
    step(1,true);
  }
  ['playing','play','pause','waiting','stalled','canplay'].forEach(e=>aC.addEventListener(e,syncPlaying));
  aC.addEventListener('ended',advance);
  aC.addEventListener('error',()=>{setLoading(false);P.playing=false;paint();toast('Track unavailable — skipping');setTimeout(advance,600)});

  ui.play.addEventListener('click',toggle);
  $('#p-next').addEventListener('click',()=>step(1));
  $('#p-prev').addEventListener('click',()=>{if(aC.currentTime>3)aC.currentTime=0;else step(-1)});
  ui.seek.addEventListener('input',()=>{const d=aC.duration||0;ui.cur.textContent=clock(ui.seek.value/1000*d);ui.fill.style.width=(ui.seek.value/10)+'%'});
  ui.seek.addEventListener('change',()=>{const d=aC.duration||0;if(d)aC.currentTime=ui.seek.value/1000*d});
  $('#p-vol').addEventListener('input',e=>{P.vol=e.target.value/100;aC.volume=P.vol;LS.set('vol',P.vol)});
  ui.fav.addEventListener('click',()=>P.cur&&toggleLike(P.cur));
  $('#p-shuffle').addEventListener('click',()=>{P.shuffle=!P.shuffle;LS.set('shuffle',P.shuffle);paintModes();toast(P.shuffle?'Shuffle on':'Shuffle off')});
  $('#p-repeat').addEventListener('click',()=>{
    P.repeat=P.repeat==='off'?'all':P.repeat==='all'?'one':'off';LS.set('repeat',P.repeat);paintModes();
    toast(P.repeat==='off'?'Repeat off':P.repeat==='all'?'Repeat queue':'Repeat one')});

  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea,select'))return;
    if(e.code==='Space'){e.preventDefault();toggle()}
    if(e.key==='ArrowRight'&&!e.altKey&&P.cur){e.preventDefault();aC.currentTime=Math.min(aC.duration||0,aC.currentTime+5)}
    if(e.key==='ArrowLeft'&&!e.altKey&&P.cur){e.preventDefault();aC.currentTime=Math.max(0,aC.currentTime-5)}
    if(e.altKey&&e.key==='ArrowRight')step(1);
    if(e.altKey&&e.key==='ArrowLeft')step(-1);
    if(e.key==='/'){e.preventDefault();go('search');setTimeout(()=>$('#search').focus(),120)}

  });

  const fx=$('#fx'),fxc=fx.getContext('2d');

  function sizeFx(){const d=Math.min(devicePixelRatio||1,3);W=innerWidth;H=innerHeight;fx.width=W*d;fx.height=H*d;fxc.setTransform(d,0,0,d,0,0)}
  function burst(x,y,n,c){for(let i=0;i<n;i++){const a=rand(0,6.3),sp=rand(1.5,6);sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,c})}ripples.push({x,y,r:4,life:1})}
  function fxDraw(){
    fxc.clearRect(0,0,W,H);
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];
      s.x+=s.vx;s.y+=s.vy;s.vy+=.16;s.vx*=.98;s.life-=.024;
      if(s.life<=0){sparks.splice(i,1);continue}
      fxc.fillStyle=s.c.replace('ALPHA',s.life.toFixed(2));fxc.fillRect(s.x,s.y,2.4,2.4)}
    for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];
      r.r+=5;r.life-=.04;if(r.life<=0){ripples.splice(i,1);continue}
      fxc.strokeStyle='rgba(255,255,255,'+(r.life*.35)+')';fxc.lineWidth=1.2;

  // ================================================================ identify
  // Same engine as the pic-search skill. trace.moe indexes anime video frames
  // only, and ~87% similarity is its line between a match and noise — below it
  // we say "no confident match" rather than dressing a guess up as an answer.
  const TRACE='https://api.trace.moe',CONFIDENT=.87;
  let idBusy=false;
  async function traceQuota(){
    const el=$('#idquota');if(!el)return;
    try{const r=await fetch(TRACE+'/me');const j=await r.json();
      el.textContent=`trace.moe: ${j.quotaUsed}/${j.quota} searches used today`}

  function idStatus(html){
    const el=$('#idout');if(!el)return;
    el.innerHTML=`<p class="grid h-full min-h-[210px] place-items-center rounded-xl px-6 py-10 text-center text-sm" style="background:rgba(255,255,255,.03);color:var(--dim)">${html}</p>`;
  }
  async function identify(src){
    if(idBusy)return;idBusy=true;
    idStatus('<span class="inline-flex items-center gap-3"><span class="h-4 w-4 animate-spin rounded-full border-2 border-white/25 border-t-white/90"></span>Matching frames…</span>');
    try{
      let res;
      if(typeof src==='string'){res=await fetch(`${TRACE}/search?anilistInfo&cutBorders&url=${encodeURIComponent(src)}`)}
      else{
        if(src.size>25e6)throw new Error('That image is over the 25MB limit.');
        const fd=new FormData();fd.append('image',src);
        res=await fetch(`${TRACE}/search?anilistInfo&cutBorders`,{method:'POST',body:fd});
      }
      if(res.status===429)throw new Error('Rate limited — trace.moe allows about 100 searches a day per IP.');
      const j=await res.json();
      if(j.error)throw new Error(j.error);
      renderIdent(j.result||[]);
    }catch(err){idStatus(`Could not identify that image.<br /><span class="opacity-70">${esc(err.message||err)}</span>`)}
    finally{idBusy=false;traceQuota()}
  }
  function renderIdent(list){
    if(!list.length)return idStatus('No candidates came back at all.');
    const top=list.slice(0,4),best=top[0],strong=(best.similarity||0)>=CONFIDENT;

    if(!strong)html+=`<div class="rounded-xl p-4" style="background:rgba(255,255,255,.05)">
      <p class="text-sm font-bold" style="color:var(--accent)">No confident match</p>
      <p class="mt-1 text-xs leading-relaxed" style="color:var(--dim)">The closest was ${(best.similarity*100).toFixed(1)}%, under the ~87% mark where matches become reliable. Treat these as guesses — and if this is artwork rather than a frame from an episode, it is not in the index at all.</p></div>`;
    html+=top.map(r=>{
      const a=r.anilist||{},t=a.title||{};
      const name=t.romaji||t.english||t.native||r.filename||'Unknown';
      const sim=r.similarity||0,ok=sim>=CONFIDENT;
      return `<article class="mt-3 overflow-hidden rounded-xl" style="background:rgba(255,255,255,.05)">
        <div class="flex flex-wrap items-start gap-4 p-4">
          <div class="min-w-0 flex-1">

              ${a.isAdult?'<span class="rounded-full bg-black/50 px-2.5 py-1 text-[10px] font-bold uppercase" style="color:#F0937F">Adult</span>':''}
            </div>

            <p class="mt-2 text-sm">Episode <span class="font-bold">${r.episode??'—'}</span> · <span class="text-xs tabular-nums">${clock(r.from)}–${clock(r.to)}</span></p>
            ${a.id?`<a href="https://anilist.co/anime/${a.id}" target="_blank" rel="noopener noreferrer"
              class="mt-3 inline-block rounded-full px-4 py-2 text-[11px] font-bold transition hover:bg-white/16" style="background:rgba(255,255,255,.1)">View on AniList</a>`:''}

  // The identify view is re-rendered on navigation, so its controls are bound

  function sizeSaver(){const d=Math.min(devicePixelRatio||1,3);SW=innerWidth;SH=innerHeight;sc.width=SW*d;sc.height=SH*d;sx.setTransform(d,0,0,d,0,0)}

  function drawScene(){
    const s=SCENES[sceneIdx];
    const now=performance.now();sceneT+=Math.min((now-sceneLast)/1000,.1);sceneLast=now;
    if(s.key==='sakura'){
      const g=sx.createLinearGradient(0,0,0,SH);
      g.addColorStop(0,'#120A14');g.addColorStop(.55,'#1B0C10');g.addColorStop(1,'#050406');
      sx.fillStyle=g;sx.fillRect(0,0,SW,SH);
      const mx=SW*.68,my=SH*.3,mr=Math.min(SW,SH)*.17;
      const mg=sx.createRadialGradient(mx,my,mr*.2,mx,my,mr*2.6);
      mg.addColorStop(0,'rgba(226,84,60,.95)');mg.addColorStop(.35,'rgba(140,28,21,.55)');mg.addColorStop(1,'rgba(140,28,21,0)');
      sx.fillStyle=mg;sx.beginPath();sx.arc(mx,my,mr*2.6,0,6.3);sx.fill();
      sx.fillStyle='#E2543C';sx.beginPath();sx.arc(mx,my,mr,0,6.3);sx.fill();
      [['#100A12',.74,90],['#0A060C',.84,60],['#050308',.93,40]].forEach(([c,base,amp],li)=>{
        sx.fillStyle=c;sx.beginPath();sx.moveTo(0,SH);
        for(let x=0;x<=SW;x+=18){const y=SH*base+Math.sin(x/(220+li*90)+li*2+sceneT*.05)*amp*.35-Math.abs(Math.sin(x/420+li))*amp;sx.lineTo(x,y)}
        sx.lineTo(SW,SH);sx.closePath();sx.fill()});
      for(const p of parts){
        p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
        if(p.y>SH+20){p.y=-20;p.x=rand(0,SW)}if(p.x<-30)p.x=SW+20;
        sx.save();sx.translate(p.x,p.y);sx.rotate(p.r);
        sx.fillStyle='rgba(240,170,180,'+p.a+')';
        sx.beginPath();sx.moveTo(0,-p.s*.5);
        sx.bezierCurveTo(p.s*.55,-p.s*.3,p.s*.45,p.s*.42,0,p.s*.5);
        sx.bezierCurveTo(-p.s*.45,p.s*.42,-p.s*.55,-p.s*.3,0,-p.s*.5);
        sx.fill();sx.restore();
      }
    } else if(s.key==='enso'){
      sx.fillStyle='#050406';sx.fillRect(0,0,SW,SH);
      const cx0=SW/2,cy0=SH*.48,R=Math.min(SW,SH)*.26;
      const cyc=sceneT%9;let prog,alpha;
      if(cyc<3.4){prog=cyc/3.4;alpha=1}else if(cyc<6.6){prog=1;alpha=1}else{prog=1;alpha=Math.max(0,1-(cyc-6.6)/2.4)}
      const a0=-Math.PI*.62,span=Math.PI*1.9,segs=150;
      sx.lineCap='round';
      for(let i=0;i<segs;i++){
        const t0=i/segs,t1=(i+1)/segs;if(t0>prog)break;
        const press=Math.sin(Math.pow(t0,.85)*Math.PI);
        const dry=(Math.sin(i*12.9898)*43758.5453)%1;
        if(t0>.62&&Math.abs(dry)>.82)continue;
        const wob=Math.sin(t0*11)*2.6+Math.sin(t0*27)*1.1;
        sx.strokeStyle=`rgba(239,230,214,${(alpha*(.30+.62*press)).toFixed(3)})`;
        sx.lineWidth=4+30*press;
        sx.beginPath();sx.arc(cx0,cy0,R+wob,a0+t0*span,a0+Math.min(t1,prog)*span);sx.stroke();
      }
      for(let i=0;i<14;i++){
        const t=(i*.0721+.12)%1;if(t>prog)continue;
        const aa=a0+t*span,rr=R+((Math.sin(i*91.7)*10000)%1)*34;
        sx.fillStyle=`rgba(239,230,214,${(alpha*.22).toFixed(3)})`;
        sx.beginPath();sx.arc(cx0+Math.cos(aa)*rr,cy0+Math.sin(aa)*rr,1+(i%4)*.9,0,6.3);sx.fill();
      }
      if(prog>=1){
        const sxp=cx0+R*.96,syp=cy0+R*.74,sz=42;
        sx.fillStyle=`rgba(190,40,30,${(alpha*.92).toFixed(3)})`;sx.fillRect(sxp-sz/2,syp-sz/2,sz,sz);
        sx.fillStyle=`rgba(255,240,225,${(alpha*.95).toFixed(3)})`;
        sx.font='700 26px "Shippori Mincho B1", serif';sx.textAlign='center';sx.textBaseline='middle';
        sx.fillText('円',sxp,syp+1);sx.textAlign='start';sx.textBaseline='alphabetic';
      }
    } else if(s.key==='bamboo'){
      const g=sx.createLinearGradient(0,0,0,SH);g.addColorStop(0,'#050A08');g.addColorStop(1,'#020503');
      sx.fillStyle=g;sx.fillRect(0,0,SW,SH);
      for(const p of parts){if(p.rain||p.fly)continue;
        const sway=Math.sin(sceneT*.5+p.sway)*8*p.d;
        sx.fillStyle=`rgba(${Math.round(24+p.d*30)},${Math.round(48+p.d*60)},${Math.round(32+p.d*36)},${.35+p.d*.5})`;
        sx.fillRect(p.x+sway,0,p.w*p.d,SH);
        sx.fillStyle='rgba(0,0,0,.25)';
        for(let y=(sceneT*4)%120;y<SH;y+=120)sx.fillRect(p.x+sway,y,p.w*p.d,3)}
      sx.strokeStyle='rgba(190,215,225,.30)';sx.lineWidth=1;
      for(const p of parts){if(!p.rain)continue;
        p.y+=p.sp;if(p.y>SH){p.y=-30;p.x=rand(0,SW)}
        sx.beginPath();sx.moveTo(p.x,p.y);sx.lineTo(p.x-2,p.y+p.len);sx.stroke()}
      for(const p of parts){if(!p.fly)continue;
        p.ph+=p.sp*60;const a=(Math.sin(p.ph)+1)/2;
        sx.fillStyle='rgba(232,206,132,'+(a*.85)+')';
        sx.beginPath();sx.arc(p.x+Math.sin(p.ph*.3)*26,p.y+Math.cos(p.ph*.21)*18,1.8,0,6.3);sx.fill()}
    } else {
      sx.fillStyle='#040305';sx.fillRect(0,0,SW,SH);
      const fg=sx.createLinearGradient(0,SH,0,SH*.5);
      fg.addColorStop(0,'rgba(216,84,40,.34)');fg.addColorStop(.45,'rgba(150,40,22,.12)');fg.addColorStop(1,'rgba(216,84,40,0)');
      sx.fillStyle=fg;sx.fillRect(0,SH*.5,SW,SH*.5);
      if(blades.length<7&&Math.random()<.16){
        const ang=rand(-.62,.42);
        blades.push({x:rand(-SW*.15,SW*.5),y:rand(SH*.12,SH*.86),ln:rand(SW*.45,SW*1.05),ang,life:1,w:rand(1.6,3.6)});
        const b=blades[blades.length-1];
        for(let i=0;i<14;i++){const t=Math.random();
          parts.push({ember:1,hot:1,x:b.x+Math.cos(ang)*b.ln*t,y:b.y+Math.sin(ang)*b.ln*t,s:rand(1,3),vy:rand(-1.8,-.5),ph:rand(0,6.3)})}
      }
      for(let i=blades.length-1;i>=0;i--){
        const b=blades[i];b.life-=.014;if(b.life<=0){blades.splice(i,1);continue}
        const a=b.life;
        sx.save();sx.translate(b.x,b.y);sx.rotate(b.ang);
        const g=sx.createLinearGradient(0,0,b.ln,0);
        g.addColorStop(0,'rgba(255,255,255,0)');
        g.addColorStop(.42,`rgba(255,246,220,${(a*.95).toFixed(3)})`);
        g.addColorStop(.62,`rgba(255,214,150,${(a*.8).toFixed(3)})`);
        g.addColorStop(1,'rgba(255,255,255,0)');
        sx.strokeStyle=g;sx.lineWidth=b.w*(.4+a*.9);
        sx.shadowColor=`rgba(216,64,47,${a.toFixed(3)})`;sx.shadowBlur=30*a;
        sx.beginPath();sx.moveTo(0,0);sx.lineTo(b.ln,0);sx.stroke();
        sx.globalAlpha=a*.28;sx.lineWidth=b.w*9;sx.stroke();sx.globalAlpha=1;sx.restore();
      }
      for(let i=parts.length-1;i>=0;i--){const p=parts[i];
        p.y+=p.vy;p.x+=Math.sin(p.ph+=.03)*.5;
        if(p.y<-20){if(p.hot){parts.splice(i,1);continue}p.y=SH+10;p.x=rand(0,SW)}
        sx.fillStyle=p.hot?'rgba(255,206,140,.92)':'rgba(226,130,64,.6)';
        sx.beginPath();sx.arc(p.x,p.y,p.s,0,6.3);sx.fill()}
    }
  }

  const saver=$('#saver'),sc=$('#saver-canvas'),sx=sc.getContext('2d');
  let saverOn=false,sceneIdx=0,sceneT=0,sceneLast=0,sceneTimer=0,idleTimer=0;
  let SW=0,SH=0,parts=[],blades=[];
  function sleep(on){
    if(on===saverOn)return;
    saverOn=on;saver.classList.toggle('on',on);saver.setAttribute('aria-hidden',String(!on));
    if(on){sizeSaver();initScene(sceneIdx);tickClock();
      sceneTimer=setInterval(()=>slash(()=>initScene((sceneIdx+1)%SCENES.length)),14000)}
    else clearInterval(sceneTimer);
  }
  function tickClock(){const d=new Date();
    $('#saver-clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  setInterval(tickClock,20000);
  const IDLE=90000;
  function wake(){
    if(saverOn)sleep(false);
    clearTimeout(idleTimer);
    if(!REDUCE)idleTimer=setTimeout(()=>sleep(true),IDLE);
  }
  ['keydown','wheel','touchstart','pointerdown','pointermove'].forEach(e=>addEventListener(e,wake,{passive:true}));
  $('#saver-start').addEventListener('click',()=>setTimeout(()=>sleep(true),60));


  // ============================================================ loop
  function frame(){
    requestAnimationFrame(frame);
    syncPlaying();
    if(P.cur){
      const t=aC.currentTime||0,d=aC.duration||P.cur.duration||0;
      ui.cur.textContent=clock(t);
      if(d&&isFinite(d))ui.dur.textContent=clock(d);
      if(document.activeElement!==ui.seek&&d){const p=t/d*100;ui.seek.value=Math.round(p*10);ui.fill.style.width=p+'%'}
    }
    if(saverOn){drawScene();return}
    fxDraw();
  }

  // ============================================================ boot
  let netNote='';
  function sizeAll(){sizeFx();sizeSaver()}
  addEventListener('resize',sizeAll);
  applyProfile();fillForm();drawLibrary();paintModes();
  aC.volume=P.vol;$('#p-vol').value=Math.round(P.vol*100);
  ui.fav.innerHTML=heart(false);
  sizeAll();tickClock();render();wake();requestAnimationFrame(frame);

  (async()=>{
    try{
      TRENDS=await loadTrends();
      if(!TRENDS.length)throw new Error('empty');
    }catch(err){
      TRENDS=[];
      netNote='Trending could not load — this app needs internet access to reach Audius. Your library, playlists and profile still work.';
    }
    render();
  })();

  window.__gc={get view(){return view},get param(){return param},get trends(){return TRENDS},get search(){return SEARCH},
    get liked(){return liked},get lists(){return lists},get prof(){return prof},get queue(){return P.queue},
    get playing(){return P.playing},get shuffle(){return P.shuffle},get repeat(){return P.repeat},go};
})();
</script>
