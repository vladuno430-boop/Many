<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}MediaBot Admin{% endblock %}</title>
  <style>
    /* Dark-first design system. Everything is inline: the CSP forbids
       third-party assets, and the panel must work on an isolated VPS. */
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #1a2331;
      --border: #243044;
      --text: #e6ecf5;
      --muted: #8b9ab1;
      --accent: #4f8cff;
      --success: #2ecc71;
      --warning: #f5a623;
      --danger: #ff5c5c;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .layout { display: flex; min-height: 100vh; }
    aside {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      flex-shrink: 0;
    }
    aside h1 { font-size: 18px; margin: 0 0 24px; letter-spacing: .5px; }
    aside nav a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    aside nav a:hover, aside nav a.active {
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
    }
    main { flex: 1; padding: 28px 32px; overflow-x: auto; }
    header.page {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    header.page h2 { margin: 0; font-size: 22px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .card .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .6px; }
    .card .value { font-size: 26px; font-weight: 650; margin-top: 6px; }
    .card .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: .5px; }
    tr:hover td { background: var(--surface-2); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 12px; border: 1px solid var(--border); color: var(--muted);
    }
    .badge.free { color: var(--muted); }
    .badge.premium { color: var(--accent); border-color: var(--accent); }
    .badge.vip { color: var(--warning); border-color: var(--warning); }
    .badge.lifetime { color: var(--success); border-color: var(--success); }
    .badge.banned, .badge.failed { color: var(--danger); border-color: var(--danger); }
    .badge.paid, .badge.active { color: var(--success); border-color: var(--success); }
    input, select, button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    form.inline { display: inline; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .chart { width: 100%; height: auto; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
    .bars .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
    footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>⚡ MediaBot</h1>
    <nav>
      <a href="/admin">📊 Dashboard</a>
      <a href="/admin/users">👥 Users</a>
      <a href="/admin/payments">💳 Payments</a>
      <a href="/admin/promos">🎟 Promo codes</a>
      <a href="/admin/queue">📦 Queue</a>
      <a href="/admin/logs">📜 Audit log</a>
      <a href="/admin/logout">🚪 Sign out</a>
    </nav>
  </aside>
  <main>
    <header class="page">
      <h2>{% block heading %}Dashboard{% endblock %}</h2>
      <div class="muted">{{ username }} · {{ role }}</div>
    </header>
    {% block content %}{% endblock %}
    <footer>MediaBot v{{ version }} · admin panel</footer>
  </main>
</div>
</body>
</html>
