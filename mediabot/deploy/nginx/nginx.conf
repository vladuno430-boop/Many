# Global nginx configuration for the MediaBot edge.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;          # do not advertise the nginx version
    client_max_body_size 25m;   # Telegram webhook payloads are small
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Rate limiting: the API is public, the admin panel is not.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:10m max_size=256m inactive=60m;

    upstream mediabot_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
