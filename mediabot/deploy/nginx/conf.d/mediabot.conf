# HTTP: redirect everything to HTTPS except the ACME challenge.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS entry point for the API, the Telegram webhook and the admin panel.
server {
    listen 443 ssl;
    http2 on;
    server_name ${MEDIABOT_DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_conn perip 20;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Telegram webhook — high burst allowance, never cached.
    location /telegram/webhook {
        limit_req zone=webhook burst=120 nodelay;
        proxy_pass http://mediabot_api;
        proxy_read_timeout 30s;
    }

    # REST API.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://mediabot_api;
        proxy_read_timeout 120s;
    }

    # Admin panel — stricter limits; put it behind a VPN or an allow-list.
    location /admin {
        limit_req zone=admin burst=10 nodelay;
        # allow 10.0.0.0/8; deny all;   # uncomment to restrict by network
        proxy_pass http://mediabot_api;
        proxy_read_timeout 60s;
    }

    # Internal-only observability endpoints.
    location /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://mediabot_api/api/v1/metrics;
    }

    location = /health {
        access_log off;
        proxy_pass http://mediabot_api/api/v1/health;
    }

    location / {
        return 404;
    }
}
