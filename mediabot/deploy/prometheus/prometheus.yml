# Prometheus scrape configuration.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: mediabot

scrape_configs:
  - job_name: mediabot-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - /etc/prometheus/alerts.yml
