# =============================================================================
# Production topology for a single VPS.
#
#   postgres ─┐                     ┌─ bot        (Telegram)
#   redis   ──┼── mediabot image ───┼─ api        (REST + admin panel)
#             │                     ├─ worker(s)  (downloads, notifications)
#             │                     ├─ beat       (periodic tasks)
#             └─────────────────────┴─ scheduler  (APScheduler maintenance)
#
# Horizontal scaling: `docker compose up -d --scale worker=4`. Workers are
# stateless; they coordinate through Redis and PostgreSQL only.
# =============================================================================

x-app-common: &app-common
  image: mediabot:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  volumes:
    - media-storage:/var/lib/mediabot
    - media-logs:/var/log/mediabot
  networks: [mediabot]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB__NAME:-mediabot}
      POSTGRES_USER: ${DB__USER:-mediabot}
      POSTGRES_PASSWORD: ${DB__PASSWORD:-mediabot}
      # Deterministic collation keeps index behaviour stable across upgrades.
      POSTGRES_INITDB_ARGS: "--data-checksums --locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1536MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER:-mediabot} -d ${DB__NAME:-mediabot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mediabot]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [mediabot]

  # One-shot migration job: every other service waits for it to succeed.
  migrate:
    image: mediabot:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [mediabot]

  bot:
    <<: *app-common
    command: ["bot"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'mediabot bot' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *app-common
    command: ["api"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app-common
    command: ["worker"]
    environment:
      CELERY_CONCURRENCY: ${DOWNLOADER__MAX_CONCURRENT_JOBS:-4}
    healthcheck:
      test: ["CMD-SHELL", "celery -A mediabot.infrastructure.queue inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          # FFmpeg and yt-dlp are memory hungry; a cap protects the host.
          memory: 2G

  beat:
    <<: *app-common
    command: ["beat"]

  scheduler:
    <<: *app-common
    command: ["scheduler"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on: [api]
    networks: [mediabot]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    networks: [mediabot]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose: ["3000"]
    depends_on: [prometheus]
    networks: [mediabot]

  flower:
    <<: *app-common
    command: ["flower"]
    expose: ["5555"]

volumes:
  postgres-data:
  redis-data:
  media-storage:
  media-logs:
  nginx-cache:
  prometheus-data:
  grafana-data:

networks:
  mediabot:
    driver: bridge
